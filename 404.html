<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Página não encontrada — Renostter CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, sans-serif;
            background: #0D1117;
            color: #E6EDF3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wrap {
            text-align: center;
            padding: 48px 32px;
            max-width: 480px;
        }

        .logo-box {
            margin-bottom: 32px;
        }

        .logo-img {
            max-width: 240px;
            height: auto;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        .code {
            font-size: 6rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #00AEEF, #FF6B00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            color: #8B949E;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #00AEEF, #0080B0);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.88;
        }

        .footer {
            margin-top: 48px;
            font-size: 0.75rem;
            color: #484F58;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="logo-box">
            <img src="assets/logo-crm.png" alt="Renostter" class="logo-img">
        </div>
        <div class="code">404</div>
        <h1>Página não encontrada</h1>
        <p>A página que você está procurando não existe ou foi movida. Verifique o endereço ou volte ao início.</p>
        <a href="index.html" class="btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Ir para o Login
        </a>
        <div class="footer">© 2026 Renostter Climatização</div>
    </div>
</body>

</html>
