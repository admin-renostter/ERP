<!--
  ossec-localfiles.conf — Renostter CRM (Sprint Security Infra)

  Define QUAIS logs o agente de log (docker-compose.wazuh-agent.yml)
  envia pro Wazuh manager. Montado em
  /var/ossec/etc/ossec.conf.d/renostter-localfiles.conf dentro do
  container do agente — o Wazuh agent carrega automaticamente tudo
  que está em ossec.conf.d/*.conf além do ossec.conf principal.

  Os paths abaixo (/var/ossec/logs-source/...) são onde o
  docker-compose.wazuh-agent.yml monta os volumes 'renostter-logs' e
  'renostter-nginx-logs' (read-only) dentro deste container.
-->
<ossec_config>

  <!-- Logs de segurança da aplicação (SecurityLogger.js — Sprint
       Security Hardening 3 / V21). Um arquivo por dia,
       security-YYYY-MM-DD.jsonl, uma linha JSON por evento
       (login_failed, account_locked, token_revoked, path_traversal
       attempt, mime_spoof attempt, etc.) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/ossec/logs-source/app/security-*.jsonl</location>
    <label key="source">renostter-app-security</label>
  </localfile>

  <!-- Logs de acesso do nginx (reverse proxy em frente ao app) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs-source/nginx/access.log</location>
    <label key="source">renostter-nginx-access</label>
  </localfile>

  <!-- Logs de erro do nginx -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs-source/nginx/error.log</location>
    <label key="source">renostter-nginx-error</label>
  </localfile>

</ossec_config>
