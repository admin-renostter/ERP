# Renostter CRM — Nginx config
# Redireciona HTTP → HTTPS em prod, proxy reverso para o app

# ── HTTP → HTTPS redirect (em prod) ──
server {
    listen 80;
    server_name _;

    # ACME challenge (Let's Encrypt) — não redireciona esse path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check direto (sem TLS)
    location = /health {
        proxy_pass http://app:3000/health;
        access_log off;
    }

    # Redirect 80 → 443 em prod
    # Em dev, comente este bloco e descomente o server "HTTP only" abaixo
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server (em prod) ──
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── API ──
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # ── Webhooks (sem rate limit) ──
    location ~ ^/api/(webhooks|cobrancas/webhook) {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── UI estática ──
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health check ──
    location = /health {
        access_log off;
        proxy_pass http://app:3000/health;
    }
}

