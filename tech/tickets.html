<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus Chamados — Renostter CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/global.css" />
    <style>
        .ticket-detail-grid {
            display: grid;
            grid-template-columns: 1fr 290px;
            gap: 20px;
        }

        .meta-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .meta-item:last-child {
            border-bottom: none;
        }

        .meta-label {
            color: var(--text-secondary);
        }

        .meta-value {
            font-weight: 500;
            text-align: right;
            max-width: 60%;
        }

        .toggle-btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 50px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.78rem;
            cursor: pointer;
            transition: .2s;
        }

        .toggle-btn.active {
            background: var(--blue-dim);
            color: var(--blue);
            border-color: var(--blue);
        }

        .transfer-event {
            background: linear-gradient(135deg, rgba(0, 174, 239, .06), rgba(255, 107, 0, .04));
            border: 1px solid rgba(0, 174, 239, .2);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
        }

        .transfer-event .from-to {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .transfer-event .reason {
            font-size: 0.82rem;
            font-style: italic;
        }

        .view-pills {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .pill {
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            transition: .2s;
        }

        .pill.active {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
        }

        .pill-badge {
            background: rgba(255, 255, 255, .25);
            border-radius: 50px;
            padding: 0 7px;
            font-size: 0.72rem;
            margin-left: 4px;
        }

        @media (max-width: 1100px) {

            .col-addr,
            .col-phone {
                display: none;
            }
        }

        .part-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.82rem;
        }

        .part-status {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
    </style>
<script src="../js/api-auth.js"></script>
<script src="../js/csp-events.js"></script>
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="../assets/logo-crm.png" alt="Renostter CRM">
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-label">Minha Área</div>
                <a class="nav-item" href="dashboard.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                    </svg><span>Dashboard</span></a>
                <a class="nav-item active" href="tickets.html"><svg width="16" height="16" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 11l3 3L22 4" />
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                    </svg><span>Meus Chamados</span><span class="nav-badge notif-badge"
                        style="display:none">0</span></a>
                <a class="nav-item" href="../admin/knowledge.html"><svg width="16" height="16" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                    </svg><span>Base de Conhecimento</span></a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-card" data-on-click="auth.logout()">
                    <div class="user-avatar" id="sidebarAvatar">T</div>
                    <div class="user-info"><strong id="sidebarUserName">Técnico</strong><span
                            id="sidebarUserRole">Técnico</span></div>
                </div>
            </div>
        </aside>

        <div class="main-content">
            <div class="topbar">
                <div class="topbar-left">
                    <button class="hamburger btn btn-ghost btn-icon" id="hamburger"><svg width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg></button>
                    <span class="page-title">Meus Chamados</span>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary" data-on-click="openNewTicket()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19" />
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                        Novo Chamado
                    </button>
                </div>
            </div>
            <div class="page-body">
                <!-- Pill toggle: Atribuídos / Transferidos para Mim -->
                <div class="view-pills">
                    <button class="pill active" id="pill-mine" data-on-click="setView('mine')">Atribuídos a Mim <span
                            class="pill-badge" id="cnt-mine">0</span></button>
                    <button class="pill" id="pill-transferred" data-on-click="setView('transferred')">Transferidos para Mim
                        <span class="pill-badge" id="cnt-transferred">0</span></button>
                </div>

                <div class="filters-bar">
                    <div class="search-box">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        <input type="text" id="searchInput" placeholder="Buscar chamados..." data-on-input="renderTable()" />
                    </div>
                    <select class="filter-select" id="fStatus" data-on-change="renderTable()">
                        <option value="">Todos</option>
                        <option value="aberto">Aberto</option>
                        <option value="andamento">Em Andamento</option>
                        <option value="aguardando">Aguardando</option>
                        <option value="resolvido">Resolvido</option>
                        <option value="fechado">Fechado</option>
                    </select>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Título</th>
                                <th>Cliente</th>
                                <th class="col-addr">Endereço</th>
                                <th class="col-phone">Telefone</th>
                                <th>Status</th>
                                <th>Prioridade</th>
                                <th>SLA</th>
                                <th>Abertura</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="ticketsTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: New Ticket -->
    <div class="modal-overlay" id="modalNewTicket">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">📋 Novo Chamado</span>
                <button class="modal-close" data-on-click="closeModal('modalNewTicket')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Cliente <span class="form-required">*</span></label>
                        <select class="form-select" id="ntClientId" data-on-change="onNtClientChange()"></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Contrato</label>
                        <select class="form-select" id="ntContractId"></select>
                    </div>
                    <div class="form-group col-span-2">
                        <label class="form-label">Título / Assunto <span class="form-required">*</span></label>
                        <input class="form-input" id="ntTitle"
                            placeholder="Ex: Ar-condicionado não resfria na sala 3" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Categoria</label>
                        <select class="form-select" id="ntCategory">
                            <option value="corretiva">Manutenção Corretiva</option>
                            <option value="preventiva">Manutenção Preventiva</option>
                            <option value="instalacao">Instalação</option>
                            <option value="higienizacao">Higienização</option>
                            <option value="gas">Suspeita de falta de gás</option>
                            <option value="pmoc">PMOC</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Prioridade</label>
                        <select class="form-select" id="ntPriority">
                            <option value="baixa">🟢 Baixa</option>
                            <option value="media" selected>🔵 Média</option>
                            <option value="alta">🟡 Alta</option>
                            <option value="critica">🔴 Crítica</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Status inicial</label>
                        <select class="form-select" id="ntStatus">
                            <option value="aberto">Aberto</option>
                            <option value="andamento">Em Andamento</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Atribuir a</label>
                        <select class="form-select" id="ntAssignTo"></select>
                    </div>
                    <div class="form-group col-span-2">
                        <label class="form-label">Descrição</label>
                        <textarea class="form-textarea" id="ntDesc" rows="3"
                            placeholder="Descreva o problema em detalhes..."></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" data-on-click="closeModal('modalNewTicket')">Cancelar</button>
                <button class="btn btn-primary" data-on-click="createTicket()">📋 Criar Chamado</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Detail -->
    <div class="modal-overlay" id="modalDetail">
        <div class="modal modal-lg">
            <div class="modal-header">
                <div><span class="modal-title" id="detailTitle"></span>
                    <div id="detailNum" style="font-size:0.75rem;color:var(--text-secondary);margin-top:2px"></div>
                </div>
                <div style="display:flex;gap:8px;align-items:center">
                    <button class="btn btn-ghost btn-sm" data-on-click="openAddParts()">📦 Adicionar Peça</button>
                    <select class="form-select" id="detailStatusSelect" data-on-change="changeStatus()"
                        style="font-size:0.8rem;padding:5px 10px"></select>
                    <button class="btn btn-ghost btn-sm" data-on-click="openTransferModal()">🔄 Transferir</button>
                    <button class="modal-close" data-on-click="closeModal('modalDetail')">✕</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="ticket-detail-grid" id="detailGrid"></div>
            </div>
            <div class="modal-footer" id="detailFooter" style="justify-content: space-between; display: none; background: var(--bg-inset); border-top: 1px solid var(--border)">
                <div style="font-size: 0.9rem; font-weight: 600">Total Previsto: <span id="detailTotalPrevisto" style="color: var(--blue)">R$ 0,00</span></div>
                <button class="btn btn-primary" data-on-click="gerarFaturaProposta()">📄 Gerar Proposta de Fatura</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Request Parts -->
    <div class="modal-overlay" id="modalAddParts">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">📦 Adicionar Peça</span>
                <button class="modal-close" data-on-click="closeModal('modalAddParts')">✕</button>
            </div>
            <div class="modal-body">
                <div class="search-box" style="margin-bottom:12px">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" id="partSearch" placeholder="Buscar por nome ou SKU..."
                        data-on-input="renderPartList()">
                </div>
                <div id="partList" style="max-height:300px;overflow-y:auto"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" data-on-click="closeModal('modalAddParts')">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Transfer -->
    <div class="modal-overlay" id="modalTransfer">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h3 class="modal-title">🔄 Transferir Chamado</h3>
                <button class="modal-close" data-on-click="closeModal('modalTransfer')">✕</button>
            </div>
            <div class="modal-body">
                <p id="transferTicketLabel" style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:16px">
                </p>
                <div class="form-group" style="margin-bottom:14px">
                    <label class="form-label">Transferir para <span class="form-required">*</span></label>
                    <select class="form-input" id="transferToSelect">
                        <option value="">— Selecione —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Motivo <span class="form-required">*</span></label>
                    <textarea class="form-textarea" id="transferReason" rows="3"
                        placeholder="Por que está transferindo este chamado?"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" data-on-click="closeModal('modalTransfer')">Cancelar</button>
                <button class="btn btn-primary" data-on-click="confirmTransfer()">✅ Confirmar</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/proposals.js"></script>
    <script src="../js/cora_integration.js"></script>
    <script src="../js/pages/tech__tickets.js"></script>
    <div class="modal-overlay" id="modalTimeLog">
        <div class="modal" style="max-width:400px">
            <div class="modal-header">
                <span class="modal-title">Lançar Horas</span>
                <button class="modal-close" data-on-click="closeModal('modalTimeLog')">✕</button>
            </div>
            <div class="modal-body" style="display:flex;flex-direction:column;gap:12px">
                <div>
                    <label class="form-label">Data</label>
                    <input type="date" id="tlDate" class="form-input">
                </div>
                <div>
                    <label class="form-label">Tipo de Atividade</label>
                    <select id="tlType" class="form-select">
                        <option value="Deslocamento">Deslocamento</option>
                        <option value="Suporte Remoto">Suporte Remoto</option>
                        <option value="Atendimento In Loco">Atendimento In Loco</option>
                        <option value="Laboratório/Reparo">Laboratório/Reparo</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Horas Gastas</label>
                    <input type="number" id="tlHours" class="form-input" placeholder="Ex: 1.5 para 1h30min" step="0.5" min="0.5">
                </div>
                <div>
                    <label class="form-label">Observação (Opcional)</label>
                    <textarea id="tlObs" class="form-input" rows="2" placeholder="O que foi feito no período?"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" data-on-click="closeModal('modalTimeLog')">Cancelar</button>
                <button class="btn btn-primary" data-on-click="addTimeLog()">Gravar Tempo</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Checklist Item -->
    <div class="modal-overlay" id="modalChecklist">
        <div class="modal" style="max-width:400px">
            <div class="modal-header">
                <span class="modal-title">Adicionar Tarefa ao Checklist</span>
                <button class="modal-close" data-on-click="closeModal('modalChecklist')">✕</button>
            </div>
            <div class="modal-body">
                <div>
                    <label class="form-label">Descrição da Tarefa</label>
                    <textarea id="ckText" class="form-input" rows="3" placeholder="Ex: Limpar filtros da unidade interna"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" data-on-click="closeModal('modalChecklist')">Cancelar</button>
                <button class="btn btn-primary" data-on-click="addChecklistItem()">Adicionar</button>
            </div>
        </div>
    </div>
</body>

</html>
