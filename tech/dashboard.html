<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Técnico — Renostter CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="../assets/logo-crm.png" alt="Renostter CRM">
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-label">Minha Área</div>
                <a class="nav-item active" href="dashboard.html"><svg width="16" height="16" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                    </svg><span>Dashboard</span></a>
                <a class="nav-item" href="tickets.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M9 11l3 3L22 4" />
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                    </svg><span>Meus Chamados</span><span class="nav-badge notif-badge"
                        style="display:none">0</span></a>
                <a class="nav-item" href="../admin/knowledge.html"><svg width="16" height="16" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                    </svg><span>Base de Conhecimento</span></a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-card" onclick="auth.logout()">
                    <div class="user-avatar" id="sidebarAvatar">T</div>
                    <div class="user-info"><strong id="sidebarUserName">Técnico</strong><span
                            id="sidebarUserRole">Técnico</span></div>
                </div>
            </div>
        </aside>

        <div class="main-content">
            <div class="topbar">
                <div class="topbar-left">
                    <button class="hamburger btn btn-ghost btn-icon" id="hamburger"><svg width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg></button>
                    <span class="page-title">Meu Dashboard</span>
                </div>
                <div class="topbar-right">
                    <a href="tickets.html" class="btn btn-primary btn-sm">📋 Ver Chamados</a>
                </div>
            </div>

            <div class="page-body">
                <div
                    style="margin-bottom:20px;background:linear-gradient(135deg,rgba(0,174,239,.1),rgba(255,107,0,.06));border:1px solid rgba(0,174,239,.2);border-radius:var(--radius);padding:20px;display:flex;align-items:center;justify-content:space-between;gap:16px">
                    <div>
                        <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:4px">👋 Olá, <span
                                id="greetName">Técnico</span>!</h2>
                        <p style="font-size:0.875rem;color:var(--text-secondary)">Você tem <strong id="greetOpenCount"
                                style="color:var(--orange)">0</strong> chamados abertos atribuídos a você hoje.</p>
                    </div>
                    <div style="font-size:0.82rem;color:var(--text-secondary);text-align:right" id="greetDate"></div>
                </div>

                <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px" id="techKpis">
                </div>

                <div class="dash-grid">
                    <div class="card">
                        <div class="card-header"><span class="card-title">🎫 Meus Chamados — Ativos</span><a
                                href="tickets.html" class="btn btn-ghost btn-sm">Ver todos</a></div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Título</th>
                                        <th>Cliente</th>
                                        <th>Status</th>
                                        <th>SLA</th>
                                    </tr>
                                </thead>
                                <tbody id="myTickets"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><span class="card-title">🚨 Prioridade Crítica</span></div>
                        <div class="alert-list" id="criticalList"></div>
                    </div>
                </div>

                <!-- Transfers row -->
                <div class="dash-grid">
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">🔄 Transferidos para Mim</span>
                            <a href="tickets.html" class="btn btn-ghost btn-sm">Ver todos</a>
                        </div>
                        <div class="activity-list" id="transferredToMe"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="toastContainer" class="toast-container"></div>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        const session = auth.protect(['tecnico']);


        document.getElementById('greetName').textContent = session.name.split(' ')[0];
        document.getElementById('greetDate').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        const myTickets = db.get('tickets').filter(t => t.assignedTo === session.userId || t.assignedName === session.name);
        const myOpen = myTickets.filter(t => !['resolvido', 'fechado', 'cancelado'].includes(t.status));
        const myClosed = myTickets.filter(t => ['resolvido', 'fechado'].includes(t.status));

        document.getElementById('greetOpenCount').textContent = myOpen.length;

        // KPIs
        document.getElementById('techKpis').innerHTML = [
            { label: 'Atribuídos', value: myTickets.length, icon: '📋', cls: 'blue' },
            { label: 'Em Aberto', value: myOpen.length, icon: '🔵', cls: 'orange' },
            { label: 'Resolvidos', value: myClosed.length, icon: '✅', cls: 'green' },
            { label: 'Críticos', value: myOpen.filter(t => t.priority === 'critica').length, icon: '🔴', cls: 'red' },
        ].map(k => `<div class="kpi-card"><div class="kpi-info"><div class="kpi-label">${k.label}</div><div class="kpi-value">${k.value}</div></div><div class="kpi-icon ${k.cls}" style="font-size:1.3rem">${k.icon}</div></div>`).join('');

        // My active tickets table
        const sorted = myOpen.sort((a, b) => { const p = { critica: 4, alta: 3, media: 2, baixa: 1 }; return p[b.priority] - p[a.priority]; });
        document.getElementById('myTickets').innerHTML = sorted.length
            ? sorted.map(t => `<tr style="cursor:pointer" onclick="location.href='tickets.html'">
      <td style="font-family:monospace;font-size:0.78rem;color:var(--text-secondary)">${t.num}</td>
      <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500">${t.title}</td>
      <td class="td-muted">${t.clientName}</td>
      <td>${badgeTicketStatus(t.status)}</td>
      <td>${renderSLABar(t)}</td>
    </tr>`).join('')
            : `<tr><td colspan="5"><div class="empty-state"><h4>Nenhum chamado ativo 🎉</h4><p>Todos os chamados estão resolvidos!</p></div></td></tr>`;

        // Critical list
        const critical = myOpen.filter(t => t.priority === 'critica' || calcSLA(t, t.contractType).state === 'danger');
        document.getElementById('criticalList').innerHTML = critical.length
            ? critical.map(t => {
                const sla = calcSLA(t, t.contractType); return `
    <div class="alert-row critical" style="cursor:pointer" onclick="location.href='tickets.html'">
      <div class="alert-info"><div class="alert-id">${t.num} · ${t.clientName}</div><div class="alert-name">${t.title}</div></div>
      <div class="alert-time ${sla.isExpired ? 'red' : 'warn'}">${sla.label}</div>
    </div>`;
            }).join('')
            : `<p style="color:var(--text-secondary);font-size:0.85rem;padding:20px;text-align:center">✅ Nenhum chamado crítico</p>`;

        initSidebar();

        // Transferred-to-me card
        const myTransfers = db.get('transfers')
            .filter(x => x.toUserId === session.userId)
            .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
            .slice(0, 5);
        document.getElementById('transferredToMe').innerHTML = myTransfers.length
            ? myTransfers.map(x => {
                const t = db.find('tickets', x.ticketId) || {};
                return `<div class="activity-item" style="cursor:pointer" onclick="location.href='tickets.html'">
      <div class="act-icon" style="background:rgba(0,174,239,.12);color:var(--blue)">🔄</div>
      <div class="act-body">
        <div class="act-title">${esc(x.ticketNum)} — ${esc(x.ticketTitle || t.title || '—')}</div>
        <div class="act-meta">De: <strong>${esc(x.fromUserName)}</strong> · ${fmt.relative(x.createdAt)}</div>
        <div class="act-meta" style="font-style:italic">${esc(x.reason?.slice(0, 60) || '')}${(x.reason?.length || 0) > 60 ? '...' : ''}</div>
      </div>
    </div>`;
            }).join('')
            : '<p style="color:var(--text-secondary);font-size:0.85rem;padding:20px;text-align:center">Nenhum chamado transferido para você ainda.</p>';
    </script>
</body>

</html>
