<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Templates de Contrato — Renostter CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/global.css"/>
<style>
:root {
  --bg: #0a0e14; --bg-surface: #121821; --bg-card: #1a2230;
  --border: #2a3441; --border-med: #3a4654;
  --text-primary: #e8edf3; --text-secondary: #a0aab8; --text-muted: #6b7686;
  --blue: #00AEEF; --blue-dim: rgba(0,174,239,.12);
  --green: #22c55e; --green-dim: rgba(34,197,94,.12);
  --orange: #f59e0b; --red: #ef4444;
}
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text-primary); margin: 0; }
.container { max-width: 1280px; margin: 0 auto; padding: 24px; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
header h1 { font-size: 1.5rem; margin: 0; }
header .badge { background: var(--blue-dim); color: var(--blue); padding: 4px 10px; border-radius: 99px; font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

.toolbar { display: flex; gap: 10px; margin-bottom: 16px; }
.btn { background: var(--blue); color: #0a0e14; border: 0; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: .9rem; }
.btn:hover { background: #00c4ff; }
.btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
.btn-danger { background: var(--red); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: .8rem; }

.template-list { display: grid; gap: 12px; }
.template-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.template-card .info h3 { margin: 0 0 4px; font-size: 1.05rem; }
.template-card .info .slug { color: var(--text-muted); font-family: 'Courier New', monospace; font-size: .8rem; }
.template-card .info .meta { color: var(--text-secondary); font-size: .85rem; margin-top: 4px; }
.template-card .info .meta span { margin-right: 12px; }
.template-card .actions { display: flex; gap: 8px; }
.template-card.inactive { opacity: 0.5; }
.category-tag { display: inline-block; padding: 2px 8px; background: var(--blue-dim); color: var(--blue); border-radius: 4px; font-size: .72rem; font-weight: 600; }
.status-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: .72rem; font-weight: 600; }
.status-tag.ativo { background: var(--green-dim); color: var(--green); }
.status-tag.inativo { background: rgba(239,68,68,.12); color: var(--red); }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal-overlay.active { display: flex; }
.modal { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 90%; max-width: 1000px; max-height: 90vh; overflow: auto; }
.modal h2 { margin: 0 0 16px; }
.modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.modal .row.full { grid-template-columns: 1fr; }
.modal label { display: block; font-size: .85rem; color: var(--text-secondary); margin-bottom: 4px; }
.modal input, .modal select, .modal textarea { width: 100%; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 8px 12px; border-radius: 6px; font-family: inherit; font-size: .9rem; box-sizing: border-box; }
.modal textarea { font-family: 'Courier New', monospace; min-height: 280px; resize: vertical; }
.modal .vars-hint { background: var(--bg-card); padding: 12px; border-radius: 6px; margin-top: 8px; font-size: .8rem; color: var(--text-secondary); }
.modal .vars-hint code { background: var(--bg); padding: 2px 6px; border-radius: 3px; color: var(--blue); font-size: .78rem; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.preview-frame { width: 100%; height: 400px; background: #fff; border: 0; border-radius: 6px; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
.tabs button { background: transparent; border: 0; color: var(--text-secondary); padding: 10px 16px; cursor: pointer; font-size: .9rem; border-bottom: 2px solid transparent; }
.tabs button.active { color: var(--blue); border-bottom-color: var(--blue); }
.tab-content { display: none; }
.tab-content.active { display: block; }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg-card); border: 1px solid var(--border); padding: 12px 18px; border-radius: 8px; opacity: 0; transition: opacity .2s; z-index: 2000; }
.toast.show { opacity: 1; }
.toast.success { border-left: 3px solid var(--green); }
.toast.error { border-left: 3px solid var(--red); }
</style>
<script src="../js/api-auth.js"></script>
<script src="../js/csp-events.js"></script>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>📄 Templates de Contrato</h1>
      <p style="color: var(--text-secondary); margin: 4px 0 0;">Crie e gerencie templates reutilizáveis com placeholders dinâmicos.</p>
    </div>
    <div>
      <span class="badge" id="authBadge">Admin</span>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn" data-on-click="openCreateModal()">+ Novo template</button>
    <button class="btn btn-secondary" data-on-click="seedDefaults()">📥 Importar padrões</button>
    <button class="btn btn-secondary" data-on-click="openGeradosModal()">📨 Contratos Gerados</button>
    <input type="text" id="search" placeholder="🔍 Buscar por nome ou slug..." style="background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 10px 14px; border-radius: 8px; flex: 1;" data-on-input="render()">
    <select id="filterCategoria" data-on-change="render()" style="background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 10px 14px; border-radius: 8px;">
      <option value="">Todas categorias</option>
      <option value="geral">Geral</option>
      <option value="manutencao">Manutenção</option>
      <option value="pmoc">PMOC</option>
      <option value="instalacao">Instalação</option>
      <option value="emergencial">Emergencial</option>
    </select>
  </div>

  <div id="templateList" class="template-list"></div>
</div>

<!-- Modal de edição -->
<div id="editModal" class="modal-overlay">
  <div class="modal">
    <h2 id="modalTitle">Novo Template</h2>

    <div class="tabs">
      <button class="tab-btn active" data-tab="basic">Básico</button>
      <button class="tab-btn" data-tab="html">HTML</button>
      <button class="tab-btn" data-tab="css">CSS (opcional)</button>
      <button class="tab-btn" data-tab="vars">Variáveis</button>
    </div>

    <div class="tab-content active" data-tab="basic">
      <div class="row">
        <div>
          <label>Nome interno *</label>
          <input type="text" id="tpl-nome" placeholder="Ex: Contrato de Manutenção">
        </div>
        <div>
          <label>Slug (único) *</label>
          <input type="text" id="tpl-slug" placeholder="Ex: manutencao-v2">
        </div>
      </div>
      <div class="row">
        <div>
          <label>Categoria</label>
          <select id="tpl-categoria">
            <option value="geral">Geral</option>
            <option value="manutencao">Manutenção</option>
            <option value="pmoc">PMOC</option>
            <option value="instalacao">Instalação</option>
            <option value="emergencial">Emergencial</option>
          </select>
        </div>
        <div>
          <label>Tipo de contrato (opcional)</label>
          <input type="text" id="tpl-tipo" placeholder="Ex: empresarial, basico, premium">
        </div>
      </div>
      <div class="row full">
        <div>
          <label>Descrição</label>
          <input type="text" id="tpl-descricao" placeholder="Para que serve este template?">
        </div>
      </div>
    </div>

    <div class="tab-content" data-tab="html">
      <label>HTML do Template (use <code>{{variavel}}</code> para placeholders)</label>
      <textarea id="tpl-html" placeholder="<h1>Contrato</h1>&#10;<p>Cliente: {{cliente.nome}}</p>&#10;<p>Valor: {{contrato.valor_mensal_fmt}}</p>"></textarea>
    </div>

    <div class="tab-content" data-tab="css">
      <label>CSS customizado (opcional)</label>
      <textarea id="tpl-css" placeholder="body { font-family: 'Times New Roman', serif; }" style="min-height: 200px;"></textarea>
    </div>

    <div class="tab-content" data-tab="vars">
      <label>Variáveis detectadas (automático)</label>
      <div id="varsList" class="vars-hint">Cole HTML na aba anterior para detectar variáveis.</div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" data-on-click="closeModal()">Cancelar</button>
      <button class="btn" data-on-click="saveTemplate()">💾 Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: Gerar Contrato + Enviar para Autentique (Sprint 21) -->
<div id="gerarModal" class="modal-overlay">
  <div class="modal" style="max-width: 640px;">
    <h2>📄 Gerar Contrato a partir do Template</h2>
    <p id="gerar-subtitle" style="color: var(--text-muted); font-size: .85rem; margin-top: -8px;"></p>

    <div class="tab-content active">
      <div class="row">
        <div>
          <label>Cliente *</label>
          <select id="ger-cliente">
            <option value="">Carregando clientes...</option>
          </select>
        </div>
        <div>
          <label>Contrato vinculado (opcional)</label>
          <select id="ger-contrato">
            <option value="">Sem contrato vinculado</option>
          </select>
        </div>
      </div>

      <hr style="border-color: var(--border); margin: 16px 0;">

      <h3 style="font-size: 1rem; margin: 0 0 8px;">📝 Signatários (Autentique)</h3>
      <div id="ger-signers" style="display: grid; gap: 8px; margin-bottom: 12px;"></div>
      <button class="btn btn-secondary btn-sm" data-on-click="addSigner()" type="button">+ Adicionar signatário</button>

      <div style="display: flex; align-items: center; gap: 8px; margin: 16px 0; padding: 12px; background: var(--bg-secondary); border-radius: 8px;">
        <input type="checkbox" id="ger-enviar" checked style="width: 18px; height: 18px;">
        <label for="ger-enviar" style="margin: 0;">Enviar para Autentique imediatamente após gerar</label>
      </div>

      <div id="ger-result" style="display: none; padding: 12px; background: var(--bg-card); border-radius: 8px; margin: 12px 0; font-size: .85rem;"></div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" data-on-click="closeGerarModal()">Cancelar</button>
      <button class="btn" id="ger-btn-submit" data-on-click="submitGerar()">📄 Gerar Contrato</button>
    </div>
  </div>
</div>

<!-- Modal: Contratos Gerados (Sprint 21) -->
<div id="geradosModal" class="modal-overlay">
  <div class="modal" style="max-width: 900px;">
    <h2>📨 Contratos Gerados (envios ao Autentique)</h2>
    <div id="gerados-list"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-on-click="document.getElementById('geradosModal').classList.remove('active')">Fechar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="../js/pages/admin__contract-templates.js"></script>
</body>
</html>
